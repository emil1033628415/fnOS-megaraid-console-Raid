name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 发布闸门：必需文件 / 可执行位 / 版本一致性 / 语法 / 单元测试 /
      # 敏感信息扫描 / 打包布局。CI 模式会跳过只在本机存在的 deny 列表
      # （真机序列号、hostname、内网 IP）与 fnpack 实际打包。
      - name: Pre-publish gate (integrity + secrets)
        run: ./tools/prepublish-check.sh --ci
